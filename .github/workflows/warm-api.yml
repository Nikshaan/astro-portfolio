name: Warm API

on:
  schedule:
    # Best-effort only: GitHub throttles scheduled runs (observed ~3-4 h apart),
    # worst on the :00/:15/:30/:45 slots, so use off-peak minutes.
    # Freshness does NOT depend on this: the API TTLs (2 min) + client polling
    # keep data current; this job warms the CDN and runs the sync verifiers.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-api
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ping live API routes
        run: |
          set -euo pipefail
          failed=0
          for path in \
            api/music-stats \
            api/music-radial-heatmap \
            api/github-contributions \
            api/oss-contributions \
            api/llm-from-scratch-stars
          do
            body="/tmp/$(basename "${path}").json"
            headers="/tmp/$(basename "${path}").hdr"
            code="$(
              curl -sS -D "${headers}" -o "${body}" -w "%{http_code}" \
                --max-time 30 \
                "https://nikshaan.dev/${path}" || echo "000"
            )"
            cache="$(tr -d '\r' < "${headers}" | awk 'tolower($1)=="x-cache-status:" {print $2}')"
            echo "${code} https://nikshaan.dev/${path} cache=${cache:-?}"
            if [ "${code}" != "200" ]; then
              echo "::error::${path} returned HTTP ${code}"
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi

      - name: Verify OSS PRs and issues independently
        env:
          GH_USERNAME: Nikshaan
          OSS_API_URL: https://nikshaan.dev/api/oss-contributions
          # Classic PAT from repo secrets — not GITHUB_TOKEN, which is repo-scoped
          # and cannot independently list other organizations' PRs/issues.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/verify-oss-contributions.mjs

      - name: Verify music sync independently
        # Run even if the OSS verification above failed; checks are independent.
        if: ${{ !cancelled() }}
        env:
          MUSIC_API_URL: https://nikshaan.dev/api/music-stats
          RADIAL_API_URL: https://nikshaan.dev/api/music-radial-heatmap
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
        run: node scripts/verify-music-sync.mjs
