<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="828" viewBox="0 0 1600 552">
  <rect width="1600" height="552" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1.5 L8 5 L1 8.5" fill="none" stroke="#a8a29e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Liberation Sans", "Noto Sans", sans-serif; }
    .title { font-size: 30px; font-weight: 700; fill: #1c1917; }
    .sub { font-size: 20px; fill: #78716c; }
    .h { font-size: 22px; font-weight: 700; fill: #1c1917; }
    .b { font-size: 18px; fill: #44403c; }
  </style>
  <text class="title" x="40" y="48">Publishing a post rebuilds static, crawler-ready pages with no server</text>
  <text class="sub" x="40" y="80">New posts flow left to right, bottom row right to left</text>

  <g fill="#ffffff" stroke="#d6d3d1" stroke-width="1.75">
    <rect x="40" y="104" width="360" height="168" rx="14"/>
    <rect x="424" y="104" width="360" height="168" rx="14"/>
    <rect x="808" y="104" width="360" height="168" rx="14"/>
    <rect x="1192" y="104" width="368" height="168" rx="14"/>
  </g>
  <g fill="none" stroke="#a8a29e" stroke-width="1.75" marker-end="url(#arrow)">
    <line x1="400" y1="188" x2="416" y2="188"/>
    <line x1="784" y1="188" x2="800" y2="188"/>
    <line x1="1168" y1="188" x2="1184" y2="188"/>
  </g>
  <g fill="none" stroke="#a8a29e" stroke-width="1.75" marker-end="url(#arrow)">
    <line x1="1376" y1="272" x2="1376" y2="308"/>
  </g>

  <text class="h" x="60" y="142">Writer publishes</text>
  <text class="b" x="60" y="176">TipTap editor</text>
  <text class="b" x="60" y="202">draft or live in the CMS</text>

  <text class="h" x="444" y="142">FastAPI + Postgres</text>
  <text class="b" x="444" y="176">Store TipTap JSON,</text>
  <text class="b" x="444" y="202">sanitised HTML, slug history</text>

  <text class="h" x="828" y="142">Redis debounce</text>
  <text class="b" x="828" y="176">45s window</text>
  <text class="b" x="828" y="202">one rebuild per burst</text>

  <text class="h" x="1212" y="142">Deploy hook</text>
  <text class="b" x="1212" y="176">Fire a Celery</text>
  <text class="b" x="1212" y="202">follow-up if missed</text>

  <g fill="#ffffff" stroke="#d6d3d1" stroke-width="1.75">
    <rect x="40" y="316" width="360" height="188" rx="14"/>
    <rect x="424" y="316" width="360" height="188" rx="14"/>
    <rect x="808" y="316" width="360" height="188" rx="14"/>
  </g>
  <g fill="#e4ecfc" stroke="#5988f0" stroke-width="1.75">
    <rect x="1192" y="316" width="368" height="188" rx="14"/>
  </g>
  <g fill="none" stroke="#a8a29e" stroke-width="1.75" marker-end="url(#arrow)">
    <line x1="1192" y1="410" x2="1176" y2="410"/>
    <line x1="808" y1="410" x2="792" y2="410"/>
    <line x1="424" y1="410" x2="408" y2="410"/>
  </g>

  <text class="h" x="60" y="356">Readers, crawlers</text>
  <text class="b" x="60" y="390">Full HTML first,</text>
  <text class="b" x="60" y="416">then React hydrates</text>

  <text class="h" x="444" y="356">Static host</text>
  <text class="b" x="444" y="390">Render: the server</text>
  <text class="b" x="444" y="416">is a file server</text>

  <text class="h" x="828" y="356">Build outputs</text>
  <text class="b" x="828" y="390">Pages with head tags,</text>
  <text class="b" x="828" y="416">sitemap, redirects,</text>
  <text class="b" x="828" y="442">noindex pages</text>

  <text class="h" x="1212" y="356">Build + prerender</text>
  <text class="b" x="1212" y="390">React pages to HTML</text>
  <text class="b" x="1212" y="416">12 posts at a time</text>
</svg>
